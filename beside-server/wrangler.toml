# Beside's own call server: introduces the browsers (PeerJS protocol) and hands out relay passwords.
# No public URL of its own: Beside reaches it through sitbeside.pages.dev/peerjs/ (functions/peerjs/).
name = "beside-signal"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# The Together board: one per room (the host's room code), kept in the Durable Object's own storage.
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Board"]

# Secrets (set once by deploy.sh): TURN_KEY_ID, TURN_KEY_TOKEN
# Ring: VAPID_JWK (web push key, made on the Mac and piped straight in), and for the Beside app
# APNS_KEY_P8, APNS_KEY_ID, APPLE_TEAM_ID (an Apple push key).
# Optional: HOME_ROOM, the SHA-256 of the room code, so the server answers for that room only (src/index.js says how).
