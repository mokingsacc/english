# Beside's own call server: introduces the browsers (PeerJS protocol) and hands out relay passwords.
# No public URL of its own: Beside reaches it through sitbeside.pages.dev/peerjs/ (functions/peerjs/).
name = "beside-signal"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

# Secrets (set once by deploy.sh): TURN_KEY_ID, TURN_KEY_TOKEN
