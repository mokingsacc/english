<!doctype html>
<html lang="fa" dir="rtl" class="theme-b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="انگلیسی">
<meta name="theme-color" content="#FFFBF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15132A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>انگلیسی</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
/* Three looks share one component system: each theme maps its palette onto --p-* tokens. Default look: B (Rang). */
:root{
  --a-bg:#F1F3F7; --a-surface:#FFFFFF; --a-ink:#1B2130; --a-muted:#6C7383; --a-line:#E3E6EE; --a-accent:#5460C8; --a-accent-ink:#FFFFFF; --a-soft:#E8EAFB; --a-warm:#D9A441; --a-good:#3E8E6B; --a-good-soft:#E3F2EA; --a-bad:#C2554D; --a-shadow:0 10px 30px rgba(27,33,48,.08);
  --b-bg:#FFFBF2; --b-surface:#FFFFFF; --b-ink:#17142B; --b-muted:#5E5A78; --b-line:#17142B; --b-accent:#FF5C4D; --b-accent-ink:#17142B; --b-soft:#FFE39A; --b-warm:#FFD23F; --b-blue:#3B5BFF; --b-lime:#BDF26B; --b-good:#2E9E5B; --b-good-soft:#D8F7B6; --b-bad:#D63B2F; --b-shadow:5px 5px 0 var(--b-line);
  --c-bg:#F9F4E8; --c-surface:#FFFDF8; --c-ink:#1F2A44; --c-muted:#6F6A5F; --c-line:#E7DCC4; --c-accent:#1C9C94; --c-accent-ink:#FFFFFF; --c-soft:#DDF1EE; --c-warm:#E09F2D; --c-pom:#A32638; --c-good:#1C9C94; --c-good-soft:#DDF1EE; --c-bad:#A32638; --c-shadow:0 6px 20px rgba(31,42,68,.08);
  --amber:#C98A00;
}
@media (prefers-color-scheme: dark){
  :root{
    --a-bg:#13161F; --a-surface:#1D2130; --a-ink:#ECEEF6; --a-muted:#9AA1B5; --a-line:#2B3043; --a-accent:#8C96F0; --a-accent-ink:#13161F; --a-soft:#262B45; --a-warm:#E5B85A; --a-good:#6DC39A; --a-good-soft:#1F3A30; --a-bad:#E07A72; --a-shadow:0 10px 30px rgba(0,0,0,.35);
    --b-bg:#15132A; --b-surface:#201D3E; --b-ink:#F7F4FF; --b-muted:#B6B0D6; --b-line:#F7F4FF; --b-accent:#FF6F61; --b-accent-ink:#17142B; --b-soft:#5A4B1A; --b-warm:#FFD23F; --b-blue:#6F86FF; --b-lime:#BDF26B; --b-good:#59D28A; --b-good-soft:#2A4A2E; --b-bad:#FF7A6E; --b-shadow:5px 5px 0 var(--b-line);
    --c-bg:#131A2B; --c-surface:#1B2338; --c-ink:#F4EEDF; --c-muted:#B2AB99; --c-line:#2F3A55; --c-accent:#3FC1B7; --c-accent-ink:#0F1A24; --c-soft:#1E3A3F; --c-warm:#EFB44C; --c-pom:#D7475B; --c-good:#3FC1B7; --c-good-soft:#1E3A3F; --c-bad:#D7475B; --c-shadow:0 6px 20px rgba(0,0,0,.35);
    --amber:#F0B429;
    color-scheme:dark;
  }
}
html.theme-a{--p-bg:var(--a-bg);--p-surface:var(--a-surface);--p-ink:var(--a-ink);--p-muted:var(--a-muted);--p-line:var(--a-line);--p-accent:var(--a-accent);--p-accent-ink:var(--a-accent-ink);--p-soft:var(--a-soft);--p-warm:var(--a-warm);--p-good:var(--a-good);--p-good-soft:var(--a-good-soft);--p-bad:var(--a-bad);--p-shadow:var(--a-shadow);--p-border:0;--p-r:24px;--p-rb:18px;--p-font-en:'Newsreader',Georgia,'Times New Roman',serif}
html.theme-b{--p-bg:var(--b-bg);--p-surface:var(--b-surface);--p-ink:var(--b-ink);--p-muted:var(--b-muted);--p-line:var(--b-line);--p-accent:var(--b-accent);--p-accent-ink:var(--b-accent-ink);--p-soft:var(--b-soft);--p-warm:var(--b-warm);--p-good:var(--b-good);--p-good-soft:var(--b-good-soft);--p-bad:var(--b-bad);--p-shadow:var(--b-shadow);--p-border:2px solid var(--b-line);--p-r:20px;--p-rb:16px;--p-font-en:'Bricolage Grotesque','Arial Black',Helvetica,sans-serif}
html.theme-c{--p-bg:var(--c-bg);--p-surface:var(--c-surface);--p-ink:var(--c-ink);--p-muted:var(--c-muted);--p-line:var(--c-line);--p-accent:var(--c-accent);--p-accent-ink:var(--c-accent-ink);--p-soft:var(--c-soft);--p-warm:var(--c-warm);--p-good:var(--c-good);--p-good-soft:var(--c-good-soft);--p-bad:var(--c-bad);--p-shadow:var(--c-shadow);--p-border:1px solid var(--c-line);--p-r:16px;--p-rb:14px;--p-font-en:'Cormorant Garamond',Georgia,'Times New Roman',serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--p-bg);color:var(--p-ink);font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a.btnlike{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--p-accent);outline-offset:2px}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.en{font-family:var(--p-font-en);direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 18px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.content>*{flex-shrink:0}
.tabbar{display:flex;justify-content:space-around;align-items:center;padding:8px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--p-line);flex:none;background:var(--p-surface)}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--p-muted);padding:6px 18px;border-radius:14px;position:relative;min-width:72px}
.tabbar button svg.ic{font-size:24px}
.tabbar button[aria-current]{color:var(--p-accent)}
.badge{position:absolute;top:0;inset-inline-end:10px;min-width:20px;height:20px;border-radius:10px;background:var(--p-accent);color:var(--p-accent-ink);font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:800}
.bottom{flex:none;padding:10px 18px calc(12px + env(safe-area-inset-bottom));background:var(--p-bg)}

/* home */
.greet{display:flex;justify-content:space-between;align-items:center;padding-top:6px;gap:12px}
.greet .hi{font-size:22px;font-weight:800}
.greet .sub{font-size:14px;color:var(--p-muted)}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--p-soft);color:var(--p-accent);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.card{background:var(--p-surface);border-radius:var(--p-r);box-shadow:var(--p-shadow);border:var(--p-border)}
.install{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:15px}
.install .ii{width:40px;height:40px;border-radius:12px;background:var(--p-soft);display:grid;place-items:center;flex:none;font-size:22px;color:var(--p-ink)}
.install b{display:block;font-size:16px}
.install svg.share{display:inline-block;vertical-align:-3px;font-size:18px}
.today{padding:18px;display:grid;gap:3px;position:relative;overflow:hidden}
.eyebrow{font-size:13px;font-weight:700;color:var(--p-accent);display:flex;align-items:center;gap:6px}
.today h2{margin:2px 0 0;font-size:27px;font-weight:800;line-height:1.25}
.today .en-sub{font-size:19px;color:var(--p-muted);line-height:1.3}
.today .meta{display:flex;gap:8px;font-size:14px;color:var(--p-muted);margin-top:4px}
.cta{margin-top:12px;border:0;border-radius:var(--p-rb);background:var(--p-accent);color:var(--p-accent-ink);min-height:58px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .1s ease,filter .15s;text-decoration:none}
.cta:active{transform:scale(.97);filter:brightness(.95)}
.cta[disabled]{opacity:.45;pointer-events:none}
.cta svg.ic{font-size:21px}
.cta.secondary{background:var(--p-surface);color:var(--p-ink);border:var(--p-border);box-shadow:var(--p-shadow)}
.streak{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 16px}
.flame{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--p-soft);color:var(--p-warm);flex:none}
.flame svg.ic{font-size:25px;fill:currentColor;stroke-width:0}
.streak .s-num{font-size:28px;font-weight:800;line-height:1}
.streak .s-label{font-size:14px;color:var(--p-muted)}
.days{display:flex;justify-content:space-between;flex-basis:100%;padding-top:4px}
.days i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-style:normal;background:var(--p-soft);color:var(--p-muted);border:2px solid transparent}
.days i.on{background:var(--p-warm);color:var(--p-bg)}
.days i.cur{border-color:var(--p-warm);color:var(--p-ink)}
.sec-title{font-size:15px;font-weight:800;color:var(--p-muted);display:flex;justify-content:space-between;align-items:baseline}
.sec-title small{font-weight:600;font-size:13px}
.path ol{list-style:none;margin:0;padding:0;display:grid}
.path li{display:flex;align-items:center;gap:14px;padding:8px 4px;position:relative;border-radius:14px}
.path li:active{background:var(--p-soft)}
.path li+li::before{content:'';position:absolute;top:-16px;inset-inline-start:25px;width:2px;height:24px;background:var(--p-line);border-radius:2px}
.path li.done+li::before{background:var(--p-good)}
.node{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--p-surface);border:2px solid var(--p-line);color:var(--p-muted);flex:none;position:relative;z-index:1}
.node svg.ic{font-size:21px}
li.done .node{background:var(--p-good);border-color:var(--p-good);color:var(--p-good-soft)}
li.now .node{background:var(--p-accent);border-color:var(--p-accent);color:var(--p-accent-ink);box-shadow:0 0 0 5px var(--p-soft)}
.n-title{font-weight:800;font-size:16px;line-height:1.35}
li.lock .n-title{color:var(--p-muted);font-weight:600}
.n-en{font-size:14px;color:var(--p-muted);line-height:1.3}
.n-state{margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--p-muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
li.done .n-state{color:var(--p-good)}
li.now .n-state{color:var(--p-accent)}

/* lesson */
.l-top{display:flex;align-items:center;gap:12px;padding:6px 18px 0;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--p-surface);box-shadow:var(--p-shadow);border:var(--p-border);display:grid;place-items:center;color:var(--p-ink);flex:none}
.icon-btn svg.ic{font-size:21px}
.prog{flex:1;height:10px;border-radius:5px;background:var(--p-soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--p-accent);border-radius:5px;transition:width .3s}
.l-count{font-size:14px;color:var(--p-muted);white-space:nowrap;font-weight:600}
.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding-top:20px}
.big-emoji{font-size:84px;line-height:1.1}
.intro h2{margin:0;font-size:30px;font-weight:800}
.intro .en{font-size:22px;color:var(--p-muted)}
.intro p{margin:0;color:var(--p-muted)}
.phrase{padding:22px 18px 18px;display:grid;justify-items:center;gap:6px;text-align:center}
.phrase .emo{font-size:52px;line-height:1.1}
.en-big{font-size:31px;line-height:1.2;font-weight:600;color:var(--p-ink);text-wrap:balance}
.fa-mean{font-size:19px;color:var(--p-ink);font-weight:600}
.hint{font-size:15px;color:var(--p-muted);background:var(--p-soft);border-radius:10px;padding:2px 10px}
.hint small{font-size:12px;opacity:.85}
.speaker{margin-top:8px;width:70px;height:70px;border-radius:50%;border:0;background:var(--p-accent);color:var(--p-accent-ink);display:grid;place-items:center;position:relative;transition:transform .1s}
.speaker:active{transform:scale(.94)}
.speaker svg.ic{font-size:30px}
.speaker.small{width:48px;height:48px;margin:0}
.speaker.small svg.ic{font-size:22px}
.speaker::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--p-accent);opacity:0}
.speaker.playing::after{animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
.sp-label{font-size:14px;color:var(--p-muted);font-weight:700}
.q{font-weight:800;font-size:18px;line-height:1.5}
.q .en{display:block;text-align:center;margin-top:8px;font-size:22px;font-weight:700}
.q-center{display:grid;justify-items:center;gap:10px;text-align:center}
.q-emo{font-size:46px;line-height:1.1}
.choices{display:grid;gap:10px}
.choices.row{grid-template-columns:repeat(3,1fr)}
.choice{min-height:56px;border-radius:var(--p-rb);border:2px solid var(--p-line);background:var(--p-surface);font-size:18px;font-weight:700;text-align:center;padding:10px 40px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,border-color .15s,background .15s;position:relative;line-height:1.35}
.choices.row .choice{padding:10px 8px}
.choice:active{transform:scale(.98)}
.choice.right{border-color:var(--p-good);background:var(--p-good-soft);color:var(--p-ink)}
.choice.wrong{border-color:var(--p-bad);color:var(--p-bad)}
.choice .mark{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:none;place-items:center;font-size:15px;color:var(--p-bg)}
.choices.row .choice .mark{top:-10px;transform:none;inset-inline-end:-6px}
.choice.right .mark{display:grid;background:var(--p-good)}
.choice.wrong .mark{display:grid;background:var(--p-bad)}
.answered .choice{pointer-events:none}
.feedback{border-radius:var(--p-rb);padding:12px 14px;font-weight:700;font-size:16px;display:flex;gap:10px;align-items:center}
.feedback.ok{background:var(--p-good-soft);color:var(--p-ink)}
.feedback.no{background:var(--p-surface);border:2px solid var(--p-bad);color:var(--p-ink)}
.feedback .en{font-weight:700}
.answer-line{min-height:64px;border-bottom:2px dashed var(--p-line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;direction:ltr;align-content:flex-start}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.tile{border-radius:12px;border:2px solid var(--p-line);background:var(--p-surface);padding:8px 14px;font-size:19px;font-weight:700;font-family:var(--p-font-en);min-height:48px}
.tile.used{visibility:hidden}
.trap{display:flex;gap:12px;padding:16px;align-items:flex-start}
.trap .t-ic{width:42px;height:42px;border-radius:12px;background:var(--p-soft);color:var(--p-warm);display:grid;place-items:center;flex:none}
.trap .t-ic svg.ic{font-size:23px}
.t-title{font-size:18px;font-weight:800;margin-bottom:4px}
.trap p{margin:0 0 10px;font-size:16px;line-height:1.75}
.trap .ex{display:flex;align-items:center;gap:10px;background:var(--p-soft);border-radius:12px;padding:10px 12px}
.trap .ex .en{font-size:19px;font-weight:700;flex:1}

/* complete */
.done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:10px;position:relative}
.medal{width:112px;height:112px;border-radius:50%;background:var(--p-good);color:var(--p-good-soft);display:grid;place-items:center;box-shadow:0 0 0 12px var(--p-good-soft);margin:14px 0 10px}
.medal svg.ic{font-size:56px;stroke-width:2.5}
.done-wrap h2{margin:0;font-size:34px;font-weight:800;line-height:1.1}
.d-sub{margin:0;color:var(--p-muted);font-size:16px}
.stats{display:flex;gap:10px;width:100%;margin-top:8px}
.stats div{flex:1;padding:12px 10px;display:grid;gap:2px;justify-items:center}
.stats b{font-size:26px;font-weight:800;line-height:1.1}
.stats span{font-size:13px;color:var(--p-muted)}
.ai-btn{margin-top:8px;width:100%;border:0;border-radius:var(--p-rb);background:var(--p-accent);color:var(--p-accent-ink);min-height:78px;padding:12px 18px;display:flex;align-items:center;gap:14px;text-align:start;transition:transform .1s;text-decoration:none}
.ai-btn:active{transform:scale(.97)}
.ai-btn .mic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.ai-btn .mic svg.ic{font-size:25px}
.ai-main{display:block;font-size:20px;font-weight:800;line-height:1.25}
.ai-sub{display:block;font-size:13px;opacity:.9;margin-top:2px}
.ai-sub .en{font-weight:700}
.d-cap{margin:0;font-size:15px;color:var(--p-muted);line-height:1.7;padding:0 6px}
.paste-note{font-size:14px;line-height:1.7;background:var(--p-soft);border-radius:12px;padding:10px 12px;text-align:start;width:100%}
.row2{display:flex;gap:10px;width:100%}
.row2>*{flex:1}
.small-btn{border:var(--p-border);border-radius:12px;background:var(--p-surface);min-height:46px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px;box-shadow:var(--p-shadow)}
.small-btn svg.ic{font-size:18px}
details.brief{width:100%;text-align:start;font-size:13px;color:var(--p-muted)}
details.brief summary{cursor:pointer;font-weight:700;padding:6px 0}
details.brief pre{white-space:pre-wrap;direction:ltr;text-align:left;font-family:inherit;background:var(--p-surface);border:1px solid var(--p-line);border-radius:10px;padding:10px;margin:4px 0 0;max-height:220px;overflow:auto;color:var(--p-ink)}
.ghost{border:0;background:transparent;color:var(--p-muted);font-size:15px;font-weight:700;padding:12px;border-radius:12px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:12px;height:12px;border-radius:2px;opacity:.95;animation:fall 3.2s linear infinite}
@keyframes fall{to{transform:translateY(460px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti i,.speaker.playing::after{animation:none}.confetti i{top:30px;opacity:.6}}

/* review + settings */
.page-title{margin:8px 0 0;font-size:26px;font-weight:800}
.empty{padding:28px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty .big-emoji{font-size:60px}
.set-group{padding:14px 16px;display:grid;gap:10px}
.set-group label,.set-label{font-weight:800;font-size:16px}
.set-help{font-size:14px;color:var(--p-muted);margin:0;line-height:1.6}
.set-group input[type=text]{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:2px solid var(--p-line);background:var(--p-bg);color:var(--p-ink);width:100%}
.seg{display:flex;border:2px solid var(--p-line);border-radius:14px;padding:3px;background:var(--p-bg);gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-size:15px;font-weight:700;color:var(--p-muted);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--p-accent);color:var(--p-accent-ink)}
.check-sum{padding:14px 16px;font-weight:800;font-size:17px;display:flex;gap:10px;align-items:center}
.check-row{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--p-line);align-items:flex-start}
.check-row:last-child{border-bottom:0}
.st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:17px;font-weight:800;color:#fff}
.st.ok{background:var(--p-good)}
.st.warn{background:var(--amber);color:#1a1300}
.st.bad{background:var(--p-bad)}
.st.wait{background:var(--p-line);color:var(--p-ink)}
.cr-fa{font-weight:800}
.cr-en{font-size:14px;color:var(--p-muted);direction:ltr;text-align:right}
.cr-fix{font-size:14px;margin-top:4px;line-height:1.6}
.cr-fix .en-fix{display:block;color:var(--p-muted);direction:ltr;text-align:right}
.cr-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.meta-line{font-size:13px;color:var(--p-muted);text-align:center}
.danger{color:var(--p-bad)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--p-ink);color:var(--p-bg);padding:10px 18px;border-radius:14px;font-weight:700;font-size:15px;z-index:20;max-width:88vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- Theme A · Nasim ---------- */
.theme-a .en{font-weight:500}
.theme-a .today .en-sub{font-style:italic;font-size:21px}
.theme-a .en-big{font-size:33px;font-weight:500}
.theme-a .today{background:linear-gradient(160deg,var(--p-surface),var(--p-soft))}
.theme-a .choice.en{font-family:'Newsreader',Georgia,serif;font-size:20px}

/* ---------- Theme B · Rang ---------- */
.theme-b body{font-weight:500}
.theme-b .en{font-weight:700;letter-spacing:-.01em}
.theme-b .greet .hi{font-size:25px}
.theme-b .avatar{border:2px solid var(--p-line);background:var(--b-lime);color:var(--b-ink)}
.theme-b .cta,.theme-b .ai-btn,.theme-b .speaker,.theme-b .icon-btn{border:2px solid var(--p-line);box-shadow:var(--b-shadow)}
.theme-b .cta:active,.theme-b .ai-btn:active,.theme-b .speaker:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--p-line)}
.theme-b .today{background:var(--b-blue);color:#FFFFFF}
.theme-b .today .eyebrow,.theme-b .today .en-sub,.theme-b .today .meta{color:#FFFFFF;opacity:.92}
.theme-b .today h2{font-size:31px}
.theme-b .today .en-sub{font-size:21px}
.theme-b .streak{background:var(--b-warm);color:#17142B}
.theme-b .streak .s-label{color:#17142B;opacity:.8}
.theme-b .flame{background:#FFFFFF;color:#FF5C4D;border:2px solid #17142B}
.theme-b .days i{background:#FFFFFF;color:#17142B;border:2px solid transparent}
.theme-b .days i.on{background:#17142B;color:var(--b-warm)}
.theme-b .days i.cur{border-color:#17142B;background:transparent}
.theme-b .node{width:52px;height:52px;border:2px solid var(--p-line);border-radius:16px;color:var(--b-ink)}
.theme-b li.done .node{background:var(--b-lime);color:#17142B}
.theme-b li.now .node{background:var(--b-accent);color:#17142B;box-shadow:3px 3px 0 var(--p-line)}
.theme-b li.lock .node{background:var(--b-surface);color:var(--b-muted)}
.theme-b .path li+li::before{inset-inline-start:29px;background:var(--p-line);opacity:.25}
.theme-b .path li.done+li::before{background:var(--b-good);opacity:1}
.theme-b .n-title{font-size:17px}
.theme-b .tabbar{border-top:2px solid var(--p-line)}
.theme-b .tabbar button[aria-current]{color:#17142B;background:var(--b-warm);border:2px solid var(--p-line)}
.theme-b .prog{border:2px solid var(--p-line);height:14px;background:var(--b-surface)}
.theme-b .prog i{background:var(--b-blue)}
.theme-b .en-big{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.theme-b .phrase{background:var(--b-soft)}
.theme-b .speaker{background:var(--b-accent);color:#17142B}
.theme-b .choice{border:2px solid var(--p-line);font-weight:800;box-shadow:3px 3px 0 var(--p-line)}
.theme-b .choice:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--p-line)}
.theme-b .choice.right{background:var(--b-lime);color:#17142B}
.theme-b .tile{box-shadow:3px 3px 0 var(--p-line)}
.theme-b .trap .t-ic{background:var(--b-warm);color:#17142B;border:2px solid var(--p-line)}
.theme-b .medal{background:var(--b-lime);color:#17142B;border:3px solid var(--p-line);box-shadow:6px 6px 0 var(--p-line)}
.theme-b .done-wrap h2{font-size:42px}
.theme-b .stats div{border:2px solid var(--p-line);background:var(--b-surface);box-shadow:3px 3px 0 var(--p-line);border-radius:16px}
.theme-b .stats div:first-child{background:var(--b-warm);color:#17142B}
.theme-b .stats div:first-child span{color:#17142B;opacity:.8}
.theme-b .ai-btn .mic{background:#FFFFFF;border:2px solid #17142B;color:#17142B}
.theme-b .seg{border-color:var(--p-line)}
.theme-b .feedback.ok{background:var(--b-lime);color:#17142B;border:2px solid var(--p-line)}

/* ---------- Theme C · Kashi ---------- */
.theme-c .en{font-weight:600}
.theme-c .tiled{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><g fill='none' stroke='%231C9C94' stroke-opacity='.22' stroke-width='1'><rect x='14' y='14' width='28' height='28'/><rect x='14' y='14' width='28' height='28' transform='rotate(45 28 28)'/></g><circle cx='28' cy='28' r='2.5' fill='%23E09F2D' fill-opacity='.5'/></svg>") top center/56px 56px repeat-x}
.theme-c .avatar{background:var(--c-pom);color:#FFF6E8;border-radius:30%}
.theme-c .today{border:1px solid var(--c-warm);box-shadow:var(--c-shadow),inset 0 0 0 4px var(--p-surface),inset 0 0 0 5px var(--c-line)}
.theme-c .today .en-sub{font-size:23px;font-style:italic;font-weight:500}
.theme-c .en-big{font-size:32px;line-height:1.1}
.theme-c .flame{background:var(--c-pom);color:#FFF1E6}
.theme-c .days i.on{background:var(--c-pom);color:#FFF1E6}
.theme-c .days i.cur{border-color:var(--c-pom)}
.theme-c .node{border-radius:8px}
.theme-c li.done .node{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-accent-ink)}
.theme-c li.now .node{background:var(--c-warm);border-color:var(--c-warm);color:#2B2109}
.theme-c .speaker{background:var(--c-pom);color:#FFF1E6;border-radius:30%}
.theme-c .speaker::after{border-radius:36%;border-color:var(--c-pom)}
.theme-c .phrase{border-top:3px solid var(--c-accent)}
.theme-c .choice.en{font-family:'Cormorant Garamond',Georgia,serif;font-size:21px}
.theme-c .trap .t-ic{background:var(--c-warm);color:#2B2109;border-radius:8px}
.theme-c .medal{background:var(--c-pom);color:#FFF1E6;border-radius:30%;box-shadow:0 0 0 10px var(--p-soft)}
</style>
</head>

var DIGITS = '۰۱۲۳۴۵۶۷۸۹';
function fa(n){ return String(n).replace(/\d/g, function(d){ return DIGITS[d]; }); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ic(id){ return '<svg class="ic" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today(){ return dstr(new Date()); }
function addDays(s, n){ var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + n); return dstr(d); }
function niceDate(s){
  var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]);
  try { return d.toLocaleDateString('fa-AF', { weekday:'long', day:'numeric', month:'long' }); } catch (e) { return fa(s); }
}

/* ---------- storage ---------- */
var storageOK = true;
function freshState(){
  return { v:1, name:'فرشته', points:0, settings:{ ai:'claude', hints:'auto', theme:CONFIG.defaultTheme }, done:{}, streak:{ count:0, last:'' }, days:[], cards:{} };
}
function loadState(){
  try {
    var raw = localStorage.getItem(CONFIG.storageKey);
    if (!raw) return freshState();
    var s = JSON.parse(raw), f = freshState();
    for (var k in f) if (!(k in s)) s[k] = f[k];
    for (var k2 in f.settings) if (!(k2 in s.settings)) s.settings[k2] = f.settings[k2];
    return s;
  } catch (e) { storageOK = false; return freshState(); }
}
function save(){
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(st)); storageOK = true; } catch (e) { storageOK = false; }
}
var st = loadState();

/* ---------- lookups ---------- */
var PHRASES = {};
LESSONS.forEach(function(l, li){ l.phrases.forEach(function(p){ p.lesson = li; PHRASES[p.id] = p; }); });
function lessonIndex(id){ for (var i = 0; i < LESSONS.length; i++) if (LESSONS[i].id === id) return i; return -1; }
function firstOpen(){ for (var i = 0; i < LESSONS.length; i++) if (!st.done[LESSONS[i].id]) return i; return -1; }
function isStandalone(){ return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function hintsOn(li){ var h = st.settings.hints; return h === 'on' || (h === 'auto' && li < 5); }

/* ---------- streak + spaced review ---------- */
function shownStreak(){ var t = today(); return (st.streak.last === t || st.streak.last === addDays(t, -1)) ? st.streak.count : 0; }
function markActivity(){
  var t = today();
  if (st.streak.last !== t){
    st.streak.count = (st.streak.last === addDays(t, -1)) ? st.streak.count + 1 : 1;
    st.streak.last = t;
  }
  if (st.days.indexOf(t) < 0){ st.days.push(t); if (st.days.length > 21) st.days = st.days.slice(-21); }
  save();
}
var GAPS = [1, 3, 7, 14, 30];
function seeCard(id){ if (!st.cards[id]){ st.cards[id] = { box:1, due:addDays(today(), 1) }; save(); } }
function gradeCard(id, ok){
  var c = st.cards[id] || { box:1 };
  c.box = ok ? Math.min(c.box + 1, 5) : 1;
  c.due = addDays(today(), GAPS[c.box - 1]);
  st.cards[id] = c; save();
}
function dueIds(exceptLesson){
  var t = today(), out = [];
  for (var id in st.cards){ var p = PHRASES[id]; if (p && st.cards[id].due <= t && p.lesson !== exceptLesson) out.push(id); }
  out.sort(function(a, b){ return st.cards[a].due < st.cards[b].due ? -1 : st.cards[a].due > st.cards[b].due ? 1 : 0; });
  return out;
}
function nextDue(){ var m = ''; for (var id in st.cards){ var d = st.cards[id].due; if (!m || d < m) m = d; } return m; }

/* ---------- speech ---------- */
var voices = [];
function loadVoices(){ try { voices = window.speechSynthesis ? speechSynthesis.getVoices() || [] : []; } catch (e) { voices = []; } }
if (window.speechSynthesis){
  loadVoices();
  try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) { speechSynthesis.onvoiceschanged = loadVoices; }
}
function pickVoice(){
  var en = voices.filter(function(v){ return /^en/i.test(v.lang || ''); });
  var gb = en.filter(function(v){ return /en[-_]GB/i.test(v.lang); });
  var pref = gb.filter(function(v){ return /Daniel|Kate|Serena|Martha|Arthur/i.test(v.name || ''); });
  return pref[0] || gb[0] || en[0] || null;
}
var playTimer = null;
function speak(text, btn){
  var s = window.speechSynthesis;
  if (!s || !window.SpeechSynthesisUtterance){ toast('موتور صدا پیدا نشد. «بررسی برنامه» را در تنظیمات ببینید.'); return false; }
  function go(){
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB'; u.rate = 0.9;
      var v = pickVoice(); if (v) u.voice = v;
      if (btn){ btn.classList.add('playing'); clearTimeout(playTimer); playTimer = setTimeout(function(){ btn.classList.remove('playing'); }, 4000); u.onend = u.onerror = function(){ btn.classList.remove('playing'); }; }
      s.speak(u);
    } catch (e) {}
  }
  try {
    if (s.speaking || s.pending){ s.cancel(); setTimeout(go, 60); } else { go(); }
  } catch (e) { go(); }
  return true;
}
document.addEventListener('visibilitychange', function(){ try { if (!document.hidden && window.speechSynthesis) speechSynthesis.resume(); } catch (e) {} });

/* ---------- clipboard ---------- */
function legacyCopy(t){
  try {
    var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  } catch (e) { return false; }
}
function copyText(t){
  try { if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(function(){ legacyCopy(t); }); return true; } } catch (e) {}
  return legacyCopy(t);
}

function briefFor(l){
  return 'لطفاً این درس انگلیسی را با من به شکل صوتی تمرین کن.\n' +
    'You are my patient English teacher. My name is ' + (st.name || 'Freshta') + '. I speak Dari (Afghan Persian), level A1, and I live in the UK. We are talking by voice.\n' +
    'Lesson: ' + l.title.en + ' (' + l.title.fa + ').\n' +
    'Phrases: ' + l.phrases.map(function(p){ return p.en; }).join('; ') + '.\n' +
    "Today's trap for Dari speakers: " + l.trap.brief + '\n' +
    'Please: 1) Explain each phrase briefly in Dari. 2) Role-play the situation with me in very simple British English, one short line at a time, and wait for my reply. 3) Correct me gently in Dari, especially the trap. 4) Speak slowly and praise small wins. Start now: greet me in Dari and ask me to say the first phrase.';
}
function aiUrl(l){ var a = CONFIG.ai[st.settings.ai] || CONFIG.ai.claude; return a.url + encodeURIComponent(briefFor(l)); }

    h += '<section class="card today"><div class="eyebrow">' + ic('i-star') + S.todayLesson + '</div><h2>' + S.allDone + '</h2><button class="cta" type="button" data-go="review">' + S.reviewStart + ' ' + ic('i-arrow') + '</button></section>';

  var now = new Date(), idx = (now.getDay() + 1) % 7, start = addDays(t, -idx), letters = ['ش','ی','د','س','چ','پ','ج'], row = '';
  for (var i = 0; i < 7; i++){ var d = addDays(start, i), on = st.days.indexOf(d) >= 0; row += '<i class="' + (on ? 'on' : (d === t ? 'cur' : '')) + '">' + letters[i] + '</i>'; }

  h += '<section class="path"><div class="sec-title">' + S.path + ' <small>' + S.lessonsOf(doneCount, LESSONS.length) + '</small></div><ol>';

  });

/* ---------- lesson engine ---------- */
var GAP_ALT = { have:['has','having'], has:['have','having'], a:['an','the'], an:['a','the'], the:['a','an'], is:['are','am'], are:['is','am'], am:['is','are'],
  does:['do','is'], do:['does','is'], for:['to','at'], at:['in','on'], in:['on','at'], on:['in','at'], by:['with','on'], can:['is','do'], could:['can','is'],
  would:['will','do'], or:['and','but'], many:['much','more'], much:['many','more'], more:['most','much'], just:['only','very'], very:['much','many'],
  my:['me','I'], it:['is','he'], she:['he','her'], feel:['feels','felt'], live:['lives','living'], take:['took','takes'], get:['got','gets'], pick:['picks','picked'],
  book:['books','booked'], spell:['spells','spelled'], straight:['strait','straightly'], lost:['lose','losing'], far:['for','fat'], free:['three','tree'],
  single:['singer','signal'], again:['against','a gain'], all:['old','tall'], morning:['evening','night'], meet:['meat','met'], fine:['find','five'], sugar:['salt','super'],
  meat:['meet','milk'], "didn't":["don't","doesn't"], daughter:['doctor','water'] };
function words(en){ return en.split(' '); }
function bare(w){ return w.replace(/[.,?!]/g, ''); }
function norm(s){ return s.toLowerCase().replace(/[.,?!]/g, '').replace(/\s+/g, ' ').trim(); }
function pool(li, field, not){
  var out = [];
  LESSONS[li].phrases.forEach(function(p){ if (p[field] !== not) out.push(p[field]); });
  for (var i = li - 1; i >= 0 && out.length < 8; i--) LESSONS[i].phrases.forEach(function(p){ if (p[field] !== not) out.push(p[field]); });
  if (out.length < 2) for (var j = li + 1; j < LESSONS.length && out.length < 8; j++) LESSONS[j].phrases.forEach(function(p){ out.push(p[field]); });
  return shuffle(out);
}
function opts(right, wrongs, isFa){
  var seen = {}, list = [{ t:right, ok:true, fa:isFa }]; seen[right] = 1;
  wrongs.forEach(function(w){ if (list.length < 3 && !seen[w]){ seen[w] = 1; list.push({ t:w, fa:isFa }); } });
  return shuffle(list);
}
function exListen(p, review){ return { t:'ex', kind:'listen', p:p.id, review:review, say:p.en, options:opts(p.fa, pool(p.lesson, 'fa', p.fa), true) }; }
function exMeaning(p, review){ return { t:'ex', kind:'meaning', p:p.id, review:review, options:opts(p.en, pool(p.lesson, 'en', p.en), false) }; }
function exGap(p){
  var w = words(p.en); if (w.length < 2) return exMeaning(p);
  var g = Math.min(p.gap || 0, w.length - 1), target = bare(w[g]), key = target.toLowerCase();
  var alts = (GAP_ALT[key] || []).slice();
  if (alts.length < 2){ LESSONS[p.lesson].phrases.forEach(function(q){ words(q.en).forEach(function(x){ x = bare(x); if (x.toLowerCase() !== key && x.length > 1) alts.push(x); }); }); alts = alts.slice(0, 2).concat(shuffle(alts.slice(2))); }
  if (g === 0) alts = alts.map(function(a){ return a.charAt(0).toUpperCase() + a.slice(1); });
  var shown = w.map(function(x, i){ return i === g ? x.replace(bare(x), '___') : x; }).join(' ');
  return { t:'ex', kind:'gap', p:p.id, shown:shown, options:opts(target, alts, false) };
}
function exOrder(p){
  var w = words(p.en).map(bare);
  if (w.length < 3) return exMeaning(p);
  var tiles = w.map(function(x, i){ return { w:x, i:i }; }), sh = shuffle(tiles), tries = 0;
  while (sh.map(function(t){ return t.i; }).join() === tiles.map(function(t){ return t.i; }).join() && tries++ < 5) sh = shuffle(tiles);
  return { t:'ex', kind:'order', p:p.id, tiles:sh, answer:w.join(' ') };
}
function buildSteps(li){
  var L = LESSONS[li], P = L.phrases, s = [{ t:'intro' }];
  s.push({ t:'phrase', p:P[0].id }, { t:'phrase', p:P[1].id }, exListen(P[0]), exMeaning(P[1]));
  s.push({ t:'phrase', p:P[2].id }, { t:'phrase', p:P[3].id }, exGap(P[2]), exOrder(P[3]));
  s.push({ t:'phrase', p:P[4].id }, { t:'phrase', p:P[5].id }, exListen(P[4]), exGap(P[5]));
  s.push({ t:'trap' }, { t:'ex', kind:'drill' });
  dueIds(li).slice(0, 3).forEach(function(id, k){ var p = PHRASES[id]; s.push(k % 2 ? exMeaning(p, true) : exListen(p, true)); });
  s.push({ t:'complete' });
  return s;
}
function buildReview(){
  var ids = dueIds(-1).slice(0, 12), s = [];
  ids.forEach(function(id, k){ var p = PHRASES[id]; s.push(k % 2 ? exMeaning(p, true) : exListen(p, true)); });
  s.push({ t:'complete' });
  return s;
}
function startLesson(li){ go('lesson', { li:li, steps:buildSteps(li), i:0, answered:false, isReview:false, correct:0 }); }
function startReview(){ go('lesson', { li:-1, steps:buildReview(), i:0, answered:false, isReview:true, correct:0 }); }

function choicesHtml(o, row){
  return '<div class="choices' + (row ? ' row' : '') + '">' + o.map(function(c){
    return '<button class="choice' + (c.fa ? '' : ' en') + '" type="button"' + (c.fa ? '' : ' lang="en"') + (c.ok ? ' data-ok' : '') + '>' + esc(c.t) +
      '<span class="mark">' + ic(c.ok ? 'i-check' : 'i-x') + '</span></button>';
  }).join('') + '</div>';
}
function renderLesson(){
  var v = view, step = v.steps[v.i], L = v.li >= 0 ? LESSONS[v.li] : null;
  var total = v.steps.length, h = '';
  if (step.t !== 'complete'){
    h += '<div class="l-top"><button class="icon-btn" type="button" data-go="home" aria-label="بستن">' + ic('i-x') + '</button><div class="prog"><i style="width:' + Math.round(v.i / (total - 1) * 100) + '%"></i></div><span class="l-count">' + fa(v.i + 1) + ' از ' + fa(total - 1) + '</span></div>';
  }
  h += '<div class="content">';
  var bottom = '', autoSay = null;
  if (step.t === 'intro'){
    h += '<div class="intro"><div class="big-emoji">' + L.emoji + '</div><h2>' + esc(L.title.fa) + '</h2><div class="en" lang="en">' + esc(L.title.en) + '</div><p>' + fa(L.phrases.length) + ' ' + S.newPhrases + ' · ' + fa(6) + ' ' + S.minutes + '</p></div>';
    bottom = '<button class="cta" type="button" data-next>' + S.start + ' ' + ic('i-arrow') + '</button>';
  } else if (step.t === 'phrase'){
    var p = PHRASES[step.p]; seeCard(p.id);
    h += '<section class="card phrase" data-say-card><div class="emo">' + p.emoji + '</div><div class="en-big en" lang="en">' + esc(p.en) + '</div><div class="fa-mean">' + esc(p.fa) + '</div>' +
      (hintsOn(p.lesson) ? '<div class="hint">' + esc(p.hint) + ' <small>(تلفظ)</small></div>' : '') +
      '<button class="speaker" type="button" data-say="' + esc(p.en) + '" aria-label="' + S.listen + '">' + ic('i-speaker') + '</button><div class="sp-label">' + S.listen + '</div></section>';
    bottom = '<button class="cta" type="button" data-next>' + S.cont + '</button>';
    autoSay = p.en;
  } else if (step.t === 'trap'){
    var tr = L.trap;
    h += '<section class="card trap"><div class="t-ic">' + ic('i-bulb') + '</div><div><div class="t-title">' + S.trap + ': ' + esc(tr.title) + '</div><p>' + esc(tr.text) + '</p>' +
      '<div class="ex"><span class="en" lang="en">' + esc(tr.example) + '</span><button class="speaker small" type="button" data-say="' + esc(tr.example) + '" aria-label="' + S.listen + '">' + ic('i-speaker') + '</button></div></div></section>';
    bottom = '<button class="cta" type="button" data-next>' + S.cont + '</button>';
  } else if (step.t === 'ex'){
    if (step.review) h += '<div class="sec-title">' + S.reviewTitle + '</div>';
    var ex = step, pp = PHRASES[ex.p];
    if (ex.kind === 'listen'){
      h += '<div class="q-center"><div class="q">' + S.qListen + '</div><button class="speaker" type="button" data-say="' + esc(ex.say) + '" aria-label="' + S.listen + '">' + ic('i-speaker') + '</button></div><section class="quiz">' + choicesHtml(ex.options) + '</section>';
      autoSay = ex.say;
    } else if (ex.kind === 'meaning'){
      h += '<div class="q-center"><div class="q-emo">' + pp.emoji + '</div><div class="q">' + S.qMeaning + '<br>«' + esc(pp.fa) + '»</div></div><section class="quiz">' + choicesHtml(ex.options) + '</section>';
    } else if (ex.kind === 'gap'){
      h += '<div class="q">' + S.qGap + '<span class="en" lang="en">' + esc(ex.shown) + '</span></div><div class="q-center"><div class="fa-mean">' + esc(pp.fa) + '</div></div><section class="quiz">' + choicesHtml(ex.options, true) + '</section>';
    } else if (ex.kind === 'order'){
      h += '<div class="q">' + S.qOrder + '</div><div class="q-center"><div class="q-emo">' + pp.emoji + '</div><div class="fa-mean">«' + esc(pp.fa) + '»</div></div>' +
        '<div class="answer-line" data-answer></div><div class="tiles">' + ex.tiles.map(function(t, k){ return '<button class="tile" type="button" data-tile="' + k + '" data-order="' + t.i + '">' + esc(t.w) + '</button>'; }).join('') + '</div>';
    } else if (ex.kind === 'drill'){
      var dr = L.trap.drill;
      h += '<div class="sec-title">' + S.trap + ': ' + esc(L.trap.title) + '</div><div class="q">' + esc(dr.q) + (dr.en ? '<span class="en" lang="en">' + esc(dr.en) + '</span>' : '') + '</div>';
      if (dr.say){ h += '<div class="q-center"><button class="speaker" type="button" data-say="' + esc(dr.say) + '" aria-label="' + S.listen + '">' + ic('i-speaker') + '</button></div>'; autoSay = dr.say; }
      if (!step.options) step.options = shuffle(dr.options.map(function(o){ return { t:o.t, ok:!!o.ok, fa:!!dr.fa }; }));
      h += '<section class="quiz">' + choicesHtml(step.options, step.options.every(function(o){ return o.t.length < 9; })) + '</section>';
    }
    h += '<div data-feedback></div>';
    bottom = ex.kind === 'order' ? '<button class="cta" type="button" data-check-order disabled>' + S.check + '</button>' : '<button class="cta" type="button" data-next hidden>' + S.cont + '</button>';
  } else if (step.t === 'complete'){
    h += renderComplete();
  }
  h += '</div>';
  if (bottom) h += '<div class="bottom">' + bottom + '</div>';
  app.innerHTML = h;
  if (autoSay && v.autoplay) speak(autoSay, app.querySelector('.speaker'));
  var c = app.querySelector('.content'); if (c) c.scrollTop = 0;
}
function renderComplete(){
  var v = view, h = '', cols = ['var(--p-accent)', 'var(--p-warm)', 'var(--p-good)', 'var(--b-blue)'];
  h += '<div class="done-wrap"><div class="confetti" aria-hidden="true">';
  for (var i = 0; i < 8; i++) h += '<i style="left:' + (6 + i * 12) + '%;background:' + cols[i % 4] + ';animation-delay:' + (i * 0.37).toFixed(2) + 's"></i>';
  h += '</div><div class="medal">' + ic('i-check') + '</div><h2>' + S.bravo + '</h2>';
  if (v.isReview){
    h += '<p class="d-sub">' + S.reviewDone + '</p><div class="stats"><div class="card"><b>+' + fa(v.gained || 0) + '</b><span>' + S.points + '</span></div><div class="card"><b data-streak>' + fa(shownStreak()) + '</b><span>' + S.streakLabel + '</span></div></div>' +
      '<button class="cta" type="button" data-go="home">' + S.home + '</button></div>';
    return h;
  }
  var L = LESSONS[v.li], brief = briefFor(L), ai = CONFIG.ai[st.settings.ai] || CONFIG.ai.claude;
  h += '<p class="d-sub">' + esc(S.lessonDone(L.title.fa)) + '</p><div class="stats"><div class="card"><b>+' + fa(10) + '</b><span>' + S.points + '</span></div><div class="card"><b data-streak>' + fa(shownStreak()) + '</b><span>' + S.streakLabel + '</span></div></div>' +
    '<a class="ai-btn" data-ai-link href="' + esc(aiUrl(L)) + '" target="_blank" rel="noopener"><span class="mic">' + ic('i-mic') + '</span><span><span class="ai-main">' + S.talk + '</span><span class="ai-sub">با <span class="en" lang="en">' + ai.name + '</span> · ' + S.changeInSettings + '</span></span></a>' +
    '<p class="d-cap">' + S.talkCap + '</p>' +
    '<div class="paste-note" data-paste-note>' + S.pasteNote + '</div>' +
    '<div class="row2"><button class="small-btn" type="button" data-copy>' + ic('i-copy') + S.copy + '</button></div>' +
    '<details class="brief"><summary>' + S.showBrief + '</summary><pre>' + esc(brief) + '</pre></details>' +
    '<button class="ghost" type="button" data-go="home">' + S.notNow + '</button></div>';
  return h;
}
function finishLesson(){
  var v = view;
  if (v.isReview){ v.gained = v.correct; st.points += v.correct; }
  else { st.done[LESSONS[v.li].id] = today(); st.points += 10; }
  markActivity();
}
function nextStep(){
  var v = view;
  v.i++; v.answered = false; v.autoplay = true;
  if (v.steps[v.i].t === 'complete') finishLesson();
  renderLesson();
}
function answer(btn){
  var v = view, step = v.steps[v.i], quiz = btn.closest('.quiz');
  if (v.answered) return;
  v.answered = true; quiz.classList.add('answered');
  var ok = btn.hasAttribute('data-ok');
  btn.classList.add(ok ? 'right' : 'wrong');
  var right = quiz.querySelector('[data-ok]'); if (right) right.classList.add('right');
  if (step.review){ gradeCard(step.p, ok); if (ok) v.correct++; }
  showFeedback(ok, right ? right.textContent : '', right && right.classList.contains('en'));
  if (ok && step.p && step.kind !== 'listen') speak(PHRASES[step.p].en);
}
function showFeedback(ok, rightText, isEn){
  var f = app.querySelector('[data-feedback]');
  f.innerHTML = ok ? '<div class="feedback ok">✓ ' + S.right + '</div>'
    : '<div class="feedback no">' + S.wrongIs + ' <span' + (isEn ? ' class="en" lang="en"' : '') + '>' + esc(rightText) + '</span></div>';
  var n = app.querySelector('[data-next]'); if (n){ n.hidden = false; n.textContent = ok ? S.cont : S.gotIt; }
  setTimeout(function(){ var c = app.querySelector('.content'); if (c) c.scrollTop = c.scrollHeight; }, 30);
}
function tapTile(btn){
  if (view.answered) return;
  var line = app.querySelector('[data-answer]');
  if (btn.parentElement === line){
    var orig = app.querySelector('.tiles [data-tile="' + btn.getAttribute('data-src') + '"]'); if (orig) orig.classList.remove('used');
    btn.remove();
  } else {
    if (btn.classList.contains('used')) return;
    btn.classList.add('used');
    var c = document.createElement('button'); c.type = 'button'; c.className = 'tile'; c.textContent = btn.textContent; c.setAttribute('data-src', btn.getAttribute('data-tile'));
    line.appendChild(c);
  }
  var chk = app.querySelector('[data-check-order]'); if (chk) chk.disabled = !line.children.length;
}
function checkOrder(){
  var v = view, step = v.steps[v.i], line = app.querySelector('[data-answer]');
  if (v.answered){ nextStep(); return; }
  var built = Array.prototype.map.call(line.children, function(b){ return b.textContent; }).join(' ');
  var ok = norm(built) === norm(step.answer);
  v.answered = true;
  showFeedback(ok, PHRASES[step.p].en, true);
  var chk = app.querySelector('[data-check-order]'); chk.textContent = ok ? S.cont : S.gotIt;
  speak(PHRASES[step.p].en);
}

function renderSettings(){
  var s = st.settings, h = '<div class="content"><h1 class="page-title">' + S.settings + '</h1>';
  h += '<section class="card set-group"><label for="nm">' + S.name + '</label><input id="nm" type="text" value="' + esc(st.name) + '" autocomplete="given-name" data-name><p class="set-help">' + S.nameHelp + '</p></section>';
  h += '<section class="card set-group"><div class="set-label">' + S.aiLabel + '</div>' + seg('ai', s.ai, [['claude', '<span class="en">Claude</span>'], ['chatgpt', '<span class="en">ChatGPT</span>']]) + '<p class="set-help">' + S.aiHelp + '</p></section>';
  h += '<section class="card set-group"><div class="set-label">' + S.hintsLabel + '</div>' + seg('hints', s.hints, [['auto', S.hintsAuto], ['on', S.hintsOn], ['off', S.hintsOff]]) + '<p class="set-help">' + S.hintsHelp + '</p></section>';
  h += '<section class="card set-group"><div class="set-label">' + S.themeLabel + '</div>' + seg('theme', s.theme, [['b', 'رنگ'], ['a', 'نسیم'], ['c', 'کاشی']]) + '</section>';
  h += '<button class="cta" type="button" data-selfcheck>' + ic('i-shield') + S.checkBtn + ' <span class="en" lang="en" style="font-size:14px;opacity:.85">· ' + S.checkSub + '</span></button>';
  h += '<div data-check-out></div>';
  h += '<button class="ghost danger" type="button" data-reset>' + S.reset + '</button>';
  h += '<div class="meta-line"><span class="en" lang="en">v' + CONFIG.version + ' · ' + LESSONS.length + ' lessons</span></div>';
  h += '</div>' + tabbar('settings');
  app.innerHTML = h;
}

var CHECKS = [];
function row(id, status, faT, enT, fixFa, fixEn, extra){
  return '<div class="check-row" data-row="' + id + '" data-status="' + status + '"><span class="st ' + status + '">' + (status === 'ok' ? '✓' : status === 'warn' ? '!' : status === 'bad' ? '✕' : '…') + '</span><div style="flex:1">' +
    '<div class="cr-fa">' + faT + '</div><div class="cr-en">' + enT + '</div>' +
    (fixFa ? '<div class="cr-fix">' + fixFa + '<span class="en-fix">' + fixEn + '</span></div>' : '') + (extra || '') + '</div></div>';
}
function waitVoices(ms){
  return new Promise(function(res){
    loadVoices(); if (voices.length) return res(voices);
    var done = false; function fin(){ if (done) return; done = true; loadVoices(); res(voices); }
    try { speechSynthesis.addEventListener('voiceschanged', fin, { once:true }); } catch (e) {}
    setTimeout(fin, ms);
  });
}
function selfCheck(){
  var out = app.querySelector('[data-check-out]'), rows = {}, order = ['storage','home','engine','voice','sound','net','ai','clip','font'];
  function paint(){
    var bad = order.some(function(k){ return rows[k] && rows[k].s === 'bad'; }), pending = order.some(function(k){ return !rows[k] || rows[k].s === 'wait'; });
    var sum = pending ? '' : '<div class="card check-sum" data-summary="' + (bad ? 'bad' : 'ok') + '"><span class="st ' + (bad ? 'bad' : 'ok') + '">' + (bad ? '✕' : '✓') + '</span><div>' + (bad ? S.someBad : S.allGood) + '<div class="cr-en">' + (bad ? S.someBadEn : S.allGoodEn) + '</div></div></div>';
    out.innerHTML = sum + '<section class="card set-group" data-check-list>' + order.map(function(k){ var r = rows[k]; return r ? row(k, r.s, r.fa, r.en, r.fixFa, r.fixEn, r.extra) : row(k, 'wait', '…', 'checking…'); }).join('') + '</section>';
  }
  function set(k, s, faT, enT, fixFa, fixEn, extra){ rows[k] = { s:s, fa:faT, en:enT, fixFa:fixFa, fixEn:fixEn, extra:extra }; paint(); }
  paint();

  /* 1 storage */
  var okS = false; try { localStorage.setItem('__t', '1'); okS = localStorage.getItem('__t') === '1'; localStorage.removeItem('__t'); } catch (e) {}
  okS ? set('storage', 'ok', 'حافظه کار می‌کند', 'Memory works')
      : set('storage', 'bad', 'حافظه کار نمی‌کند؛ پیشرفت ذخیره نمی‌شود', 'Memory is not working; progress will not be saved', 'برنامه را از آیکن صفحهٔ اصلی باز کنید، نه از تب خصوصی Safari.', 'Open the app from its Home Screen icon, not a private Safari tab.');
  /* 2 home screen */
  isStandalone() ? set('home', 'ok', 'روی صفحهٔ اصلی نصب است', 'Added to Home Screen')
      : set('home', 'bad', 'هنوز روی صفحهٔ اصلی نصب نشده', 'Not added to Home Screen yet', 'در Safari: دکمهٔ اشتراک، بعد «Add to Home Screen». بعد برنامه را از آیکن باز کنید.', 'In Safari: Share, then "Add to Home Screen". Then open the app from the icon.');
  /* 3 engine */
  var hasEngine = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  hasEngine ? set('engine', 'ok', 'موتور صدا موجود است', 'Speech engine is available')
      : set('engine', 'bad', 'موتور صدا در این مرورگر نیست', 'No speech engine in this browser', 'برنامه را در Safari آیفون باز کنید.', 'Open the app in Safari on the iPhone.');
  /* 4 voice */
  if (!hasEngine) set('voice', 'bad', 'صدای انگلیسی پیدا نشد', 'No English voice found', 'اول موتور صدا باید کار کند.', 'The speech engine must work first.');
  else waitVoices(2000).then(function(){
    var en = voices.filter(function(v){ return /^en/i.test(v.lang || ''); }), gb = en.filter(function(v){ return /en[-_]GB/i.test(v.lang); });
    if (gb.length) set('voice', 'ok', 'صدای انگلیسی بریتانیایی پیدا شد', 'British English voice found (' + esc(gb[0].name || 'en-GB') + ')');
    else if (en.length) set('voice', 'ok', 'صدای انگلیسی پیدا شد', 'English voice found (' + esc(en[0].name || en[0].lang) + ')');
    else set('voice', 'bad', 'صدای انگلیسی پیدا نشد', 'No English voice found', 'Settings ← Accessibility ← Spoken Content ← Voices ← English را باز کنید و یک صدا دانلود کنید.', 'Settings → Accessibility → Spoken Content → Voices → English, then download a voice.');
  });
  /* 5 sound heard (asks the person) */
  var soundAsk = '<div class="cr-actions"><button class="small-btn" type="button" data-sound-play>' + ic('i-speaker') + S.play + '</button><button class="small-btn" type="button" data-sound="yes">' + S.yes + '</button><button class="small-btn" type="button" data-sound="no">' + S.no + '</button></div>';
  set('sound', 'warn', '«پخش صدا» را بزنید، بعد بگویید: ' + S.heardQ, 'Did you hear it? Tap "play", then answer.', '', '', soundAsk);
  CHECKS.sound = function(ans){
    ans === 'yes' ? set('sound', 'ok', 'صدا شنیده می‌شود', 'Sound works')
      : set('sound', 'bad', 'صدا بسته است', 'Sound is off', 'دکمهٔ بی‌صدا در کنار آیفون را ببینید و صدا را بلند کنید.', 'Check the silent switch on the side of the iPhone and turn the volume up.', soundAsk);
  };
  /* 6 internet */
  var ctrl = window.AbortController ? new AbortController() : null, to = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 5000);
  var netBad = function(){ set('net', 'bad', 'انترنت وصل نیست', 'No internet', 'به وای‌فای یا انترنت موبایل وصل شوید. برای باز کردن برنامه و گپ زدن با هوش مصنوعی لازم است.', 'Connect to Wi-Fi or mobile data. It is needed to open the app and to talk to the AI.'); };
  if (navigator.onLine === false){ clearTimeout(to); netBad(); }
  else fetch(location.href.split('#')[0], { method:'HEAD', cache:'no-store', signal:ctrl ? ctrl.signal : undefined })
    .then(function(r){ clearTimeout(to); r.ok || r.type === 'opaque' ? set('net', 'ok', 'انترنت وصل است', 'Internet is connected') : netBad(); })
    .catch(function(){ clearTimeout(to); netBad(); });
  /* 7 AI link */
  var ai = CONFIG.ai[st.settings.ai] || CONFIG.ai.claude;
  set('ai', 'ok', 'هوش مصنوعی انتخاب‌شده: ' + ai.name, 'Chosen AI: ' + ai.name, 'اگر لینک باز نشد، برنامهٔ ' + ai.name + ' را نصب کنید و وارد حساب شوید.', 'If the link does not open, install the ' + ai.name + ' app and sign in.',
    '<div class="cr-actions"><a class="small-btn" style="text-decoration:none;color:inherit" href="' + ai.url + encodeURIComponent('Hello! Please reply in Dari.') + '" target="_blank" rel="noopener">' + S.testLink + '</a></div>');
  /* 8 clipboard */
  (navigator.clipboard && navigator.clipboard.writeText) || document.queryCommandSupported && document.queryCommandSupported('copy')
    ? set('clip', 'ok', 'کپی خودکار کار می‌کند', 'Auto-copy is available')
    : set('clip', 'warn', 'کپی خودکار شاید کار نکند؛ متن را دستی کپی کنید', 'Auto-copy may not work; copy the text by hand', '', '');
  /* 9 font */
  var fontOK = false; try { document.fonts.forEach(function(f){ if (/Vazirmatn/.test(f.family) && f.status === 'loaded') fontOK = true; }); } catch (e) {}
  fontOK ? set('font', 'ok', 'قلم برنامه آماده است', 'App font loaded')
    : set('font', 'warn', 'قلم اصلی نیامد؛ از قلم خود گوشی استفاده می‌شود', 'Main font did not load; using the phone\'s font', '', '');
}

/* ---------- events ---------- */
var resetArmed = false;
app.addEventListener('click', function(e){
  var t = e.target, el;
  if ((el = t.closest('[data-go]'))){ var g = el.getAttribute('data-go'); go(g); return; }
  if ((el = t.closest('[data-start]'))){ startLesson(+el.getAttribute('data-start')); view.autoplay = false; return; }
  if ((el = t.closest('[data-lesson]'))){
    var li = +el.getAttribute('data-lesson');
    if (el.classList.contains('lock')) toast(S.locked); else startLesson(li);
    return;
  }
  if ((el = t.closest('[data-say]'))){ speak(el.getAttribute('data-say'), el.classList.contains('speaker') ? el : null); return; }
  if ((el = t.closest('[data-say-card]'))){ var sp = el.querySelector('.speaker'); speak(sp.getAttribute('data-say'), sp); return; }
  if ((el = t.closest('.choice'))){ answer(el); return; }
  if ((el = t.closest('.tile'))){ tapTile(el); return; }
  if ((el = t.closest('[data-check-order]'))){ checkOrder(); return; }
  if ((el = t.closest('[data-next]'))){ nextStep(); return; }
  if ((el = t.closest('[data-ai-link]'))){ copyText(briefFor(LESSONS[view.li])); return; /* the link itself opens the AI */ }
  if ((el = t.closest('[data-copy]'))){ copyText(briefFor(LESSONS[view.li])); toast(S.copied); return; }
  if ((el = t.closest('[data-review-start]'))){ startReview(); return; }
  if ((el = t.closest('[data-set]'))){
    st.settings[el.getAttribute('data-set')] = el.getAttribute('data-val'); save(); applyTheme(); renderSettings(); return;
  }
  if ((el = t.closest('[data-selfcheck]'))){ selfCheck(); return; }
  if ((el = t.closest('[data-sound-play]'))){ speak('Hello, how are you?', null); return; }
  if ((el = t.closest('[data-sound]'))){ CHECKS.sound(el.getAttribute('data-sound')); return; }
  if ((el = t.closest('[data-reset]'))){
    if (!resetArmed){ resetArmed = true; el.textContent = S.resetSure; setTimeout(function(){ resetArmed = false; if (el.isConnected) el.textContent = S.reset; }, 4000); return; }
    resetArmed = false; var keep = st.settings, nm = st.name; st = freshState(); st.settings = keep; st.name = nm; save(); toast(S.resetDone); renderSettings(); return;
  }
});
app.addEventListener('input', function(e){ if (e.target.matches('[data-name]')){ st.name = e.target.value.trim().slice(0, 30); save(); } });
app.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-lesson]')){ e.preventDefault(); e.target.click(); } });

/* expose for tests */
window.APP = { CONFIG:CONFIG, LESSONS:LESSONS, state:function(){ return st; }, briefFor:briefFor, aiUrl:aiUrl, go:go };
render();
</script>
