# First Pass on Cloudflare Pages (advanced mode): public/ is the site, public/_worker.js (built by scripts/build.mjs,
# not committed) is the Worker, public/_routes.json sends only /api/*, /mcp/* and /tiles/* to it.
# Deploy with scripts/deploy.sh (never from a session unasked). `wrangler pages deploy` and `pages dev`, run from
# firstpass/, read this file: production and local runs both get the DB binding below with no dashboard setting.
name = "firstpass"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"
# AsyncLocalStorage only (node:async_hooks), for the request traces behind problem reports (src/worker/debug/trace.js).
compatibility_flags = ["nodejs_als"]

[[d1_databases]]
binding = "DB"
database_name = "firstpass"
# The id of the D1 database below; scripts/deploy.sh wrote it on the first deploy, 11 Nov 2026 (an id is not a secret).
database_id = "b15c4068-0571-42f7-9a4e-97b09aeb270d"
migrations_dir = "migrations"
